name: Vulnerabilities Check

on:
  push:
    branches: master
    paths:
      - 'cmd/konvey/**'
      - 'internal/konvey/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  vuln:
    uses: kowabunga-cloud/workflows/.github/workflows/go-vuln.yml@v1
    secrets: inherit
